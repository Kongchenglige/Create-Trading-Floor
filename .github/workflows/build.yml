name: build
on: [ pull_request, push ]

jobs:
  build-forge:
    name: Build Forge
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: make gradle wrapper executable
        run: chmod +x gradlew

      - name: disable fabric for CI
        run: |
          # Disable Fabric platform to avoid broken dependencies
          sed -i 's/^enabled_platforms = fabric,forge$/enabled_platforms = forge/' gradle.properties
          # Verify the change
          cat gradle.properties | grep enabled_platforms

      - name: build forge
        run: ./gradlew forge:build --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forge-artifacts
          path: forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 5
