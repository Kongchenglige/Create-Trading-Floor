pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.quiltmc.org/repository/release" }
        gradlePluginPortal()
    }
}

include("common")

// Read enabled platforms from gradle.properties
def enabledPlatforms = System.getProperty("enabled_platforms", "")
if (enabledPlatforms.isEmpty()) {
    // Fallback to reading from properties file
    def propsFile = new File(settingsDir, "gradle.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        enabledPlatforms = props.getProperty("enabled_platforms", "")
    }
}

// Only include platforms that are enabled
if (enabledPlatforms.contains("fabric")) {
    include("fabric")
}
if (enabledPlatforms.contains("forge")) {
    include("forge")
}

rootProject.name = "create-trading-floor"
